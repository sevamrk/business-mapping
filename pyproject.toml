[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-mapping"
version = "0.1.0"
description = "A schema for describing every function in a company, and a tool that reads it and says which ones an agent could drive"
requires-python = ">=3.10"
# No runtime dependencies, on purpose. The format is JSON and the output is
# text, both of which the standard library already does. Nothing here needs to
# be installed for `python3 main.py report` to work on a fresh clone.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The doc-drift tests read the validator's field tables directly. That is the
# point of them: they check the private structure the public behaviour is
# built from.
"tests/test_docs.py" = ["SLF001"]
