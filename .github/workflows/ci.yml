# The badge this produces is the point: third-party evidence that the suite passes,
# rather than a claim in the README. Runs on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || { pip install -e .; pip install pytest; }
      - name: Tests
        run: python -m pytest -q

  # The canvas in web/. It renders the Python tool's own report rather than recomputing
  # verdicts, so the first thing checked is that the committed report is not stale.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Committed report matches the map
        working-directory: .
        run: |
          make web-data
          git diff --exit-code -- web/src/data/report.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
